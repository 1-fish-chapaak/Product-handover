# Netlify config for the Vite SPA. Drag the `dist` folder to https://app.netlify.com/drop
# for an instant link, OR connect this repo (Netlify reads this file for git deploys).
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — serve index.html for any path so deep links / refreshes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
